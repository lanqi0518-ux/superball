name: Auto settle draws (continuous 30s heartbeat)

# GitHub Actions has TWO hard limits we work around:
#   (1) cron granularity minimum = 5 minutes
#   (2) single job max runtime = 6 hours
#
# To keep a continuous 30-second heartbeat on /api/settle:
#   - Cron fires every 3 hours (0, 3, 6, 9, 12, 15, 18, 21 UTC = 8/day)
#   - Each job loops `curl POST` every 30s for 3h10m (11400s)
#   - Consecutive jobs OVERLAP by 10 minutes; the next one queues (via
#     `concurrency: settle / cancel-in-progress:false`) and starts the
#     instant the previous one ends. From the outside it's a single
#     never-stopping process.
#
# /api/settle is idempotent per drand round, so over-firing is a no-op.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - name: Heartbeat /api/settle every 30s for 3h10m
        env:
          SETTLE_SECRET: ${{ secrets.SETTLE_SECRET }}
          SETTLE_URL: https://superball-draw.fly.dev/api/settle
        run: |
          if [ -z "$SETTLE_SECRET" ]; then
            echo "::error::SETTLE_SECRET repo secret is not set"
            exit 1
          fi
          END=$(( SECONDS + 11400 ))     # 3h10m
          COUNT=0
          while [ $SECONDS -lt $END ]; do
            COUNT=$((COUNT+1))
            NOW=$(date -u +%H:%M:%S)
            echo
            echo "[$NOW UTC] tick #$COUNT"
            RESP=$(curl -sS -m 25 -w '\nHTTP %{http_code}\n' \
              -X POST "$SETTLE_URL" \
              -H "Authorization: Bearer $SETTLE_SECRET" \
              -H "Content-Type: application/json" \
              -d '{}' || true)
            echo "$RESP"
            sleep 30
          done
